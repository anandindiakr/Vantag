# backend/webhooks/webhooks.yaml
# ================================
# Vantag outbound webhook subscription configuration.
#
# Supported connectors: slack | teams | twilio | generic
#
# Severity thresholds: LOW | MEDIUM | HIGH
#   Only events at or above the threshold are dispatched.
#
# Event types (use "*" to match all):
#   sweeping, shoplifting, tamper, fall_detected, restricted_zone,
#   loitering, watchlist_match, face_match, queue, inventory_movement,
#   dwell, empty_shelf, accident, staff_alert, pos_anomaly
#
# Twilio connector options:
#   twilio_channel: "sms" (default) or "whatsapp". For WhatsApp, set
#   twilio_from to your Twilio WhatsApp-enabled sender (e.g. the sandbox
#   number "+14155238886") and twilio_to to a number that has joined the
#   sandbox / is an approved recipient. Both are auto-prefixed with
#   "whatsapp:" — do not add the prefix yourself in the YAML.

webhooks:
  - id: slack-high-alerts
    name: "Slack High Alerts"
    connector: slack
    url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    event_types:
      - sweeping
      - shoplifting
      - watchlist_match
      - tamper
      - fall_detected
      - restricted_zone
    severity_threshold: HIGH

  - id: slack-pos-anomalies
    name: "Slack POS Anomalies"
    connector: slack
    url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    event_types:
      - pos_anomaly
    severity_threshold: MEDIUM

  - id: teams-security-channel
    name: "Teams Security Channel"
    connector: teams
    url: "https://YOUR-ORG.webhook.office.com/webhookb2/YOUR-TEAMS-WEBHOOK-URL"
    event_types:
      - accident
      - tamper
      - watchlist_match
      - shoplifting
    severity_threshold: HIGH

  - id: sms-emergency
    name: "SMS/WhatsApp Theft & Emergency Alerts"
    connector: twilio
    event_types:
      - shoplifting
      - sweeping
      - tamper
      - fall_detected
      - restricted_zone
      - watchlist_match
      - accident
    severity_threshold: HIGH
    twilio_channel: "sms"   # change to "whatsapp" to send via WhatsApp instead
    twilio_account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    twilio_auth_token: "your_twilio_auth_token_here"
    twilio_from: "+15551234567"
    twilio_to: "+15559876543"

  - id: generic-webhook
    name: "Custom System"
    connector: generic
    url: "https://your-system.com/api/vantag-events"
    event_types:
      - "*"
    severity_threshold: MEDIUM
    headers:
      Authorization: "Bearer your-api-token-here"
      Content-Type: "application/json"
    payload_template:
      source: "vantag"
      alert_type: "{{type}}"
      severity: "{{severity}}"
      store: "{{store_id}}"
      camera: "{{camera_id}}"
      occurred_at: "{{timestamp}}"
      message: "{{description}}"
