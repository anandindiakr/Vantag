# ===========================================================================
# docker/nginx/conf.d/vantag.conf
# HTTP → HTTPS redirect + HTTPS server block with SSL termination
#
# Replace YOUR_DOMAIN with your actual domain before deploying, e.g.:
#   retailnazar.in       (India)
#   vantag.com.sg        (Singapore)
#   vantag.com.my        (Malaysia)
# ===========================================================================

# ── Internal HTTP server (no TLS) ─────────────────────────────────────────────
# TLS termination is handled by the VPS's shared host-level nginx, which
# reverse-proxies to this container on an internal-only port (see
# docker-compose.prod.yml). This container must NOT redirect to HTTPS or try
# to terminate SSL itself — that caused a crash loop referencing Let's
# Encrypt files not present in this container's filesystem.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN _;

    # Let's Encrypt webroot challenge (must be accessible over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=()" always;

    # ── Frontend static files (React SPA) ────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached — always fetch fresh so new deployments
    # are picked up immediately (hashed JS/CSS bundles handle their own caching)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing fallback

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── API proxy → FastAPI backend ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Tighten rate limit on auth endpoints
    location ~ ^/api/auth/(login|register|send-otp) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass          http://vantag-backend:8800;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;   # keep WS connections alive for 1 hour
        proxy_send_timeout  3600s;
    }

    # ── Health check endpoint (no auth, no rate limit) ────────────────────────
    location /health {
        proxy_pass http://vantag-backend:8800/health;
        access_log off;
    }

    # ── Block common attack patterns ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
