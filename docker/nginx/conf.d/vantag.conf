# ===========================================================================
# docker/nginx/conf.d/vantag.conf
# Internal HTTP-only server. TLS is terminated by the VPS host-level nginx,
# which reverse-proxies to this container on an internal-only port.
# This container must NOT try to terminate SSL itself (no letsencrypt files
# exist inside this container's filesystem) - that caused a crash loop.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=()" always;

    root  /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # -----------------------------------------------------------------
    # High-throughput paths: NO rate limit.
    # Edge Agent pushes ~2-5 JPEG frames/sec per camera => hundreds of
    # requests/min, far above the 60r/m "api" zone. MJPEG streaming also
    # needs buffering disabled and long timeouts.
    # -----------------------------------------------------------------
    location = /api/edge/frame {
        client_max_body_size 10m;
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        access_log off;
    }

    location ~ ^/api/cameras/[^/]+/stream$ {
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        access_log off;
    }

    # Authenticated snapshot refreshes are deliberately separate from the
    # normal API limit. A six-camera wall refreshing every 3 seconds already
    # exceeds 60 requests/minute per browser IP; rate-limiting this route
    # creates false No Signal states even when the relay is healthy.
    location ~ ^/api/cameras/[^/]+/snapshot$ {
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
        access_log off;
    }

    location ~ ^/api/edge/(heartbeat|status|discovered) {
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ~ ^/api/auth/(login|register|send-otp) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://vantag-backend:8800;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass          http://vantag-backend:8800;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /health {
        proxy_pass http://vantag-backend:8800/health;
        access_log off;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
