# ===========================================================================
# Mosquitto MQTT broker configuration — Vantag platform (Mosquitto 2.0)
# ===========================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
max_queued_messages 1000
max_inflight_messages 20

# ---------------------------------------------------------------------------
# TCP listener — port 1883
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# ---------------------------------------------------------------------------
# WebSocket listener — port 9001
# ---------------------------------------------------------------------------
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Authentication — anonymous access disabled; clients must authenticate with
# the credentials in docker/mosquitto/passwd (see docker-compose mounts).
# Rotate the password with mosquitto_passwd and restart the broker.
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ===========================================================================
# OPTIONAL — TLS (MQTTS) listener on port 8883
# ---------------------------------------------------------------------------
# The broker currently serves plaintext MQTT on 1883. For production, agents
# reach the broker across the public internet, so enable TLS and have them
# connect on 8883. To enable:
#
#   1. Uncomment the block below.
#   2. Mount your Let's Encrypt (or other) certificate into the container, e.g.
#      add to docker-compose.prod.yml under the mosquitto service:
#        - /etc/letsencrypt/live/retail-vantag.com/fullchain.pem:/mosquitto/certs/fullchain.pem:ro
#        - /etc/letsencrypt/live/retail-vantag.com/privkey.pem:/mosquitto/certs/privkey.pem:ro
#      and ensure the `mosquitto` user can read the key (chmod 640 + group).
#   3. Publish host port 8883 (add "- 8883:8883" to the mosquitto service).
#   4. Ship the edge-agent config with mqtt_port=8883 (the agent auto-enables
#      TLS). The backend keeps connecting to the broker on the private Docker
#      network (mosquitto:1883), so it needs no TLS change — only the public
#      agent path moves to MQTTS.
#   5. Firewall 1883 off from the public internet once 8883 is verified
#      (in compose, bind 1883 to 127.0.0.1 or drop its host mapping).
# ---------------------------------------------------------------------------
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/fullchain.pem
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
