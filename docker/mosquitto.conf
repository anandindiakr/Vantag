# ===========================================================================
# Mosquitto MQTT broker configuration — Vantag platform (Mosquitto 2.0)
# ===========================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
max_queued_messages 1000
max_inflight_messages 20

# ---------------------------------------------------------------------------
# TCP listener — port 1883
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# ---------------------------------------------------------------------------
# WebSocket listener — port 9001
# ---------------------------------------------------------------------------
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Authentication — anonymous access disabled; clients must authenticate with
# the credentials in docker/mosquitto/passwd (see docker-compose mounts).
# Rotate the password with mosquitto_passwd and restart the broker.
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ===========================================================================
# TLS (MQTTS) listener on port 8883
# ---------------------------------------------------------------------------
# Public Edge Agents connect over MQTTS. The backend keeps using the private
# Docker-network listener on 1883, so only the public agent path moves to TLS.
# Certs are provisioned on the host by `docker/enable_mqtts.sh` into
# /opt/vantag/mqtt-certs and mounted read-only by docker-compose.prod.yml.
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt
cafile   /mosquitto/certs/fullchain.pem
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem
