name: Deploy Frontend (Multi-Domain)

# Real infra: ALL region domains (retailnazar.com, retail-vantag.com,
# jagajaga.my, retailbantay.com, retailpantau.com) resolve to the SAME VPS
# and nginx serves the SAME frontend/web/dist for every vhost. Region
# branding/pricing/currency is decided at RUNTIME in the browser from
# window.location.hostname (src/config/regions.ts), so a single build works
# for every domain.
#
# Previously this workflow ran 4 parallel region jobs that all SSHed into
# the same VPS and each deleted/replaced the same dist/ directory. The jobs
# raced each other: whichever finished last "won", overlapping jobs could
# leave dist/ momentarily missing or half-copied (breaking live traffic),
# and the MY job always failed on an unreachable VPS_MY_HOST secret. It is
# now a single job: one build, one atomic dist swap, health checks against
# every domain's vhost.
#
# Safety: the build happens in /tmp (never in the live dist). dist/ is
# backed up before the swap. After swapping, each domain is health-checked
# through local nginx with the right Host header. Any failure restores the
# previous dist/ automatically and fails the job.

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to VPS (serves all region domains)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IN_HOST }}
          username: ${{ secrets.VPS_IN_USER }}
          key: ${{ secrets.VPS_IN_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.VPS_IN_REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main

            BUILD_DIR="/tmp/vantag-frontend-build-$(date +%s)"
            mkdir -p "$BUILD_DIR"
            git archive HEAD frontend/web | tar -x -C "$BUILD_DIR"
            cd "$BUILD_DIR/frontend/web"

            export NODE_ENV=development
            export NPM_CONFIG_PRODUCTION=false
            export NPM_CONFIG_OMIT=
            NPM_CONFIG_CACHE="/tmp/vantag-npm-cache" npm ci --include=dev --omit=

            # One build serves every domain (region is detected at runtime
            # from the hostname). build:in only sets the prerender base URL
            # used for absolute SEO URLs in static meta tags.
            if ! npm run build:in; then
              echo "Build failed — live dist/ untouched"
              rm -rf "$BUILD_DIR"
              exit 1
            fi

            cd "${{ secrets.VPS_IN_REPO_PATH }}/frontend/web"
            rm -rf dist.bak
            if [ -d dist ]; then cp -a dist dist.bak; fi
            rm -rf dist
            cp -a "$BUILD_DIR/frontend/web/dist" dist

            echo "Waiting for nginx to pick up new files..."
            sleep 3

            FAILED=0
            for DOMAIN in retailnazar.com retail-vantag.com retailbantay.com retailpantau.com jagajaga.my; do
              HTTP_CODE=$(curl -s -o /tmp/health_body.html -w "%{http_code}" -H "Host: $DOMAIN" -k https://localhost/ || echo "000")
              if [ "$HTTP_CODE" != "200" ] || ! grep -qiE "<!doctype html|<html" /tmp/health_body.html; then
                echo "Health check FAILED for $DOMAIN (HTTP $HTTP_CODE)"
                FAILED=1
              else
                echo "Health check passed for $DOMAIN (HTTP $HTTP_CODE)"
              fi
            done

            if [ "$FAILED" = "1" ]; then
              echo "Rolling back dist/"
              rm -rf dist
              if [ -d dist.bak ]; then mv dist.bak dist; fi
              rm -rf "$BUILD_DIR"
              exit 1
            fi

            echo "Deploy successful for all domains"
            rm -rf dist.bak "$BUILD_DIR"
