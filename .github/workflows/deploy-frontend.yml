            fi

            sleep 3
            HTTP_CODE=$(curl -s -o /tmp/health_body_my.html -w "%{http_code}" -H "Host: jagajaga.my" -k https://localhost/ || echo "000")
            if [ "$HTTP_CODE" != "200" ] || ! grep -qi "retail" /tmp/health_body_my.html; then
              echo "Health check FAILED (HTTP $HTTP_CODE) — rolling back dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            echo "Health check passed (HTTP $HTTP_CODE) — deploy successful"
            rm -rf dist.bak
