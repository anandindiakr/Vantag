name: Deploy Frontend (Multi-Domain)

# Real infra: each region runs on its OWN VPS, from its own git checkout of
# this repo. nginx (docker/nginx/conf.d/vantag.conf) bind-mounts
# ../frontend/web/dist directly — so deploying the frontend is just:
#   git pull -> npm ci -> npm run build:<region>  (rebuilds dist in place)
# nginx picks up the new static files immediately, no container restart needed.
#
# Safety: dist/ is backed up before every build. After building, a local
# health check (curl through nginx with the right Host header, so it works
# even before DNS/SSL propagate) verifies the homepage responds with HTTP 200
# and contains expected marker text. If the check fails, the previous dist/
# is restored automatically and the job is marked failed.

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated regions to deploy (in,sg,my,ph) or 'all'"
        default: "all"

jobs:
  deploy-in:
    if: ${{ github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'in') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy retailnazar.com (India VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IN_HOST }}
          username: ${{ secrets.VPS_IN_USER }}
          key: ${{ secrets.VPS_IN_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_IN_REPO_PATH }}
            git pull origin main

            cd frontend/web
            rm -rf dist.bak
            [ -d dist ] && cp -r dist dist.bak || true

            npm ci
            if ! npm run build:in; then
              echo "Build failed — restoring previous dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            echo "Waiting for nginx to pick up new files..."
            sleep 3

            HTTP_CODE=$(curl -s -o /tmp/health_body_in.html -w "%{http_code}" -H "Host: retailnazar.com" -k https://localhost/ || echo "000")
            if [ "$HTTP_CODE" != "200" ] || ! grep -qi "retail" /tmp/health_body_in.html; then
              echo "Health check FAILED (HTTP $HTTP_CODE) — rolling back dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            echo "Health check passed (HTTP $HTTP_CODE) — deploy successful"
            rm -rf dist.bak

  deploy-sg:
    if: ${{ github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'sg') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy retail-vantag.com (Singapore VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SG_HOST }}
          username: ${{ secrets.VPS_SG_USER }}
          key: ${{ secrets.VPS_SG_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_SG_REPO_PATH }}
            git pull origin main

            cd frontend/web
            rm -rf dist.bak
            [ -d dist ] && cp -r dist dist.bak || true

            npm ci
            if ! npm run build:sg; then
              echo "Build failed — restoring previous dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            sleep 3
            HTTP_CODE=$(curl -s -o /tmp/health_body_sg.html -w "%{http_code}" -H "Host: retail-vantag.com" -k https://localhost/ || echo "000")
            if [ "$HTTP_CODE" != "200" ] || ! grep -qi "retail" /tmp/health_body_sg.html; then
              echo "Health check FAILED (HTTP $HTTP_CODE) — rolling back dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            echo "Health check passed (HTTP $HTTP_CODE) — deploy successful"
            rm -rf dist.bak

  deploy-ph:
    if: ${{ github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'ph') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy retailbantay.com (Philippines VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_PH_HOST }}
          username: ${{ secrets.VPS_PH_USER }}
          key: ${{ secrets.VPS_PH_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PH_REPO_PATH }}
            git pull origin main

            cd frontend/web
            rm -rf dist.bak
            [ -d dist ] && cp -r dist dist.bak || true

            npm ci
            if ! npm run build:ph; then
              echo "Build failed — restoring previous dist/"
              rm -rf dist
              mv dist.bak dist
              exit 1
            fi

            sleep 3
            HTTP_CODE=$(curl -s -o /tmp/health_body_ph.html -w "%{http_code}" -H "Host: retailbantay.com" -k https://localhost/ || echo "000")
            if [ "$HTTP_CODE" != "200" ] || ! grep -qi "retail" /tmp/health_body_ph.html; then
              echo "Health check FAILED (HTTP $HTTP_CODE) — rolling back dist/"
              rm -rf dist
