            fi

            echo "Health check passed (HTTP $HTTP_CODE) — deploy successful"
            rm -rf dist.bak

  deploy-my:
    if: ${{ github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'my') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy jagajaga.my (Malaysia VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_MY_HOST }}
          username: ${{ secrets.VPS_MY_USER }}
          key: ${{ secrets.VPS_MY_SSH_KEY }}
          script: |
            set -e
