name: Deploy Backend (Vantag FastAPI)

# Real infra: each region runs its own VPS with a git checkout of this repo.
# docker/docker-compose.prod.yml builds the backend image from source via
# docker/Dockerfile.edge (context = repo root). Deploying is:
#   git pull -> docker compose build vantag-backend -> up -d vantag-backend
# Only the backend container is rebuilt/restarted — postgres, mosquitto,
# nginx, certbot keep running untouched.
#
# Safety: the previously-deployed commit SHA is recorded before pulling. The
# new backend image is health-checked (docker compose healthcheck status,
# then a real HTTP call to /health through nginx) with retries. If it does
# not become healthy in time, the workflow automatically rolls back: git
# checkout the previous commit, rebuild, and restart — leaving the VPS on
# the last known-good version — then fails the job so it's visible in CI.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/Dockerfile.edge"
      - "docker/docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated regions to deploy (in,sg,my,ph) or 'all'"
        default: "all"

# All region jobs SSH into shared infrastructure — never allow two deploy
# runs (or two region jobs) to execute at the same time.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy-in:
    if: ${{ github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'in') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to India VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IN_HOST }}
          username: ${{ secrets.VPS_IN_USER }}
          key: ${{ secrets.VPS_IN_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.VPS_IN_REPO_PATH }}
            PREV_SHA=$(git rev-parse HEAD)
            echo "Previous known-good commit: $PREV_SHA"
            git fetch origin main
            git reset --hard origin/main

            deploy_and_check() {
              docker compose -f docker/docker-compose.prod.yml build vantag-backend
              docker compose -f docker/docker-compose.prod.yml up -d vantag-backend

              echo "Waiting for container health..."
              for i in $(seq 1 45); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' vantag-backend 2>/dev/null || echo "starting")
                if [ "$STATUS" = "healthy" ]; then
                  break
                fi
                sleep 6
              done

              HTTP_CODE="000"
              for i in $(seq 1 10); do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -k https://localhost/health || echo "000")
                if [ "$HTTP_CODE" = "200" ]; then
                  break
                fi
                sleep 6
              done
              if [ "$STATUS" = "healthy" ] && [ "$HTTP_CODE" = "200" ]; then
                return 0
              else
                echo "Backend unhealthy (container status=$STATUS, /health HTTP=$HTTP_CODE)"
                return 1
              fi
            }

            if deploy_and_check; then
              echo "Backend deploy successful and healthy."
              docker image prune -f
            else
              echo "Deploy failed health check — rolling back to $PREV_SHA"
              git reset --hard "$PREV_SHA"
              docker compose -f docker/docker-compose.prod.yml build vantag-backend
              docker compose -f docker/docker-compose.prod.yml up -d vantag-backend
              echo "Rolled back to previous version. Failing job for visibility."
              exit 1
            fi

  deploy-sg:
    needs: deploy-in
    if: ${{ !cancelled() && (github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'sg')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Singapore VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SG_HOST }}
