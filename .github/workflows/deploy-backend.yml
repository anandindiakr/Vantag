name: Deploy Backend (Vantag FastAPI)

# Real infra: ALL region domains (retailnazar.com, retail-vantag.com,
# jagajaga.my, retailjagajaga.com, retailbantay.com, retailpantau.com)
# resolve to the SAME VPS and are served by the SAME vantag-backend
# container. There is only one backend to deploy, so this workflow runs a
# single deploy job (previously 4 sequential region jobs rebuilt the same
# container 4 times, and the MY job failed on an unreachable VPS_MY_HOST
# secret).
#
# docker/docker-compose.prod.yml builds the backend image from source via
# docker/Dockerfile (context = repo root). Deploying is:
#   git pull -> docker compose build vantag-backend -> up -d vantag-backend
# Only the backend container is rebuilt/restarted — postgres, mosquitto,
# nginx, certbot keep running untouched.
#
# Safety: the previously-deployed commit SHA is recorded before pulling. The
# new backend image is health-checked (docker compose healthcheck status,
# then a real HTTP call to /health inside the container — NOT through the
# host's nginx, since the VPS hosts multiple apps and https://localhost hits
# a different vhost, returning 404 and causing false rollbacks). If it does
# not become healthy in time, the workflow automatically rolls back: git
# checkout the previous commit, rebuild, and restart — leaving the VPS on
# the last known-good version — then fails the job so it's visible in CI.
#
# Retry: the deploy is attempted TWICE. A GitHub-hosted runner's SSH
# connection to the VPS is occasionally dropped upstream before it ever
# reaches sshd — observed as "dial tcp ...:22: i/o timeout" with NO matching
# entry in the VPS sshd journal, while a different runner IP connected
# successfully 47 seconds earlier for the frontend deploy. That is a network
# flake, not a bad commit, and without a retry it silently left production
# running older code than main. The actual deploy logic lives in
# docker/deploy_backend.sh so both attempts run identical steps.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # The Edge Agent download zip is built from the copy of
      # windows_agent/ baked INTO the backend image (docker/Dockerfile
      # COPYs it), and /api/edge/agent/version reads its __init__.py.
      # So agent-only changes still require a backend image rebuild —
      # without this path the VPS would keep serving the previous agent
      # code even though the repo has a newer version.
      - "windows_agent/**"
      # Model weights are bind-mounted from the host repo's models/ dir
      # (docker-compose.prod.yml: ../models -> /app/models), so new weights
      # must trigger a backend redeploy to reach the running container.
      - "models/**"
      - "docker/Dockerfile"
      - "docker/docker-compose.prod.yml"
      - "docker/deploy_backend.sh"
      - "docker/mosquitto.conf"
      - "docker/mosquitto/passwd"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# The deploy SSHes into shared infrastructure — never allow two deploy
# runs to execute at the same time. Shared group with deploy-frontend.yml:
# both workflows git-fetch the SAME repo checkout on the VPS, and running
# them concurrently causes "cannot lock ref refs/remotes/origin/main"
# failures when one updates origin/main mid-fetch of the other.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Attempt 1. Allowed to fail without failing the job so that a dropped
      # SSH connection (see the retry note above) does not leave the VPS on an
      # older backend than main.
      - name: Deploy backend to VPS (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IN_HOST }}
          username: ${{ secrets.VPS_IN_USER }}
          key: ${{ secrets.VPS_IN_SSH_KEY }}
          command_timeout: 30m
          request_pty: true
          script: |
            set -e
            cd ${{ secrets.VPS_IN_REPO_PATH }}
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            cp -f docker/deploy_backend.sh /tmp/vantag_deploy_backend.sh
            bash /tmp/vantag_deploy_backend.sh "${{ secrets.VPS_IN_REPO_PATH }}" "$PREV_SHA"

      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      # Attempt 2 runs the exact same one-liner against the same script file in
      # the repo, so the two attempts can never drift apart. Re-running after a
      # successful-but-unhealthy attempt 1 is safe: attempt 1 already rolled the
      # repo back to the previous commit, so PREV_SHA is still a known-good
      # target and the whole sequence is idempotent.
      - name: Deploy backend to VPS (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IN_HOST }}
          username: ${{ secrets.VPS_IN_USER }}
          key: ${{ secrets.VPS_IN_SSH_KEY }}
          command_timeout: 30m
          request_pty: true
          script: |
            set -e
            cd ${{ secrets.VPS_IN_REPO_PATH }}
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            cp -f docker/deploy_backend.sh /tmp/vantag_deploy_backend.sh
            bash /tmp/vantag_deploy_backend.sh "${{ secrets.VPS_IN_REPO_PATH }}" "$PREV_SHA"

      - name: Report deploy outcome
        if: always()
        run: |
          if [ "${{ steps.attempt1.outcome }}" = "success" ]; then
            echo "Backend deployed on attempt 1."
          elif [ "${{ steps.attempt2.outcome }}" = "success" ]; then
            echo "Backend deployed on attempt 2 (attempt 1 failed)."
          else
            echo "Backend deploy FAILED on both attempts."
            exit 1
          fi
