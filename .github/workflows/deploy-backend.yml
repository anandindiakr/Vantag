  deploy-my:
    needs: deploy-ph
    if: ${{ !cancelled() && (github.event.inputs.regions == 'all' || github.event.inputs.regions == '' || contains(github.event.inputs.regions, 'my')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Malaysia VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_MY_HOST }}
