# Vantag — all domains (VPS /etc/nginx/sites-available/vantag)

# ── 1. HTTP → HTTPS canonical redirect ──
server {
    server_tokens off;
    listen 80;
    server_name
        retail-vantag.com www.retail-vantag.com
        retailnazar.com   www.retailnazar.com   retailnazar.in www.retailnazar.in retailnazar.info www.retailnazar.info
        jagajaga.my       www.jagajaga.my        retailjagajaga.com www.retailjagajaga.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($host = www.retail-vantag.com)  { return 301 https://retail-vantag.com$request_uri; }
    if ($host = www.retailnazar.com)    { return 301 https://retailnazar.com$request_uri; }
    if ($host = www.retailnazar.in)     { return 301 https://retailnazar.com$request_uri; }
    if ($host = retailnazar.in)         { return 301 https://retailnazar.com$request_uri; }
    if ($host = www.retailnazar.info)   { return 301 https://retailnazar.com$request_uri; }
    if ($host = retailnazar.info)       { return 301 https://retailnazar.com$request_uri; }
    if ($host = www.jagajaga.my)        { return 301 https://jagajaga.my$request_uri; }
    if ($host = www.retailjagajaga.com) { return 301 https://jagajaga.my$request_uri; }
    if ($host = retailjagajaga.com)     { return 301 https://jagajaga.my$request_uri; }

    return 301 https://$host$request_uri;
}

# ── 2a. HTTPS www.retail-vantag.com → bare ──
server {
    server_tokens off;
    listen 443 ssl http2;
    server_name www.retail-vantag.com;

    ssl_certificate     /etc/letsencrypt/live/retail-vantag.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail-vantag.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    return 301 https://retail-vantag.com$request_uri;
}

# ── 2b. HTTPS www.retailnazar.* + .in + .info → retailnazar.com ──
server {
    server_tokens off;
    listen 443 ssl http2;
    server_name www.retailnazar.com retailnazar.in www.retailnazar.in retailnazar.info www.retailnazar.info;

    ssl_certificate     /etc/letsencrypt/live/retail-vantag.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail-vantag.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    return 301 https://retailnazar.com$request_uri;
}

# ── 2c. HTTPS www.jagajaga.my + retailjagajaga.com → jagajaga.my ──
server {
    server_tokens off;
    listen 443 ssl http2;
    server_name www.jagajaga.my retailjagajaga.com www.retailjagajaga.com;

    ssl_certificate     /etc/letsencrypt/live/retail-vantag.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail-vantag.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    return 301 https://jagajaga.my$request_uri;
}

# ── 3. HTTPS main — 3 canonical bare domains ──
server {
    server_tokens off;
    listen 443 ssl http2;
    server_name retail-vantag.com retailnazar.com jagajaga.my;

    ssl_certificate     /etc/letsencrypt/live/retail-vantag.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail-vantag.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    client_max_body_size 50M;
    root /var/www/vantag/frontend/web/dist;

    location /downloads/ {
        alias /var/www/vantag/agents/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/robots.txt;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/sitemap.xml;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
